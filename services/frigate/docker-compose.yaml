---
name: homelab

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    container_name: frigate
    restart: always
    shm_size: 128mb
    env_file: .env
    volumes:
      - ./config:/config
      - ${MEDIA_DIR}:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 268435456
    networks:
      - homelab

networks:
  homelab:
    external: true
